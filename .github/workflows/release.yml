name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --name LanceDeck --onedir --console `
            --add-data "web;web" --add-data "data;data" --add-data "tools;tools" --add-data "tracker\config.default.json;tracker" `
            --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all dxcam `
            --hidden-import tracker.server --hidden-import tracker.paths --hidden-import tools.import_game_icons --hidden-import tools.import_game_maps --hidden-import tools.cut_mech_icons `
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on `
            run_app.py
          Copy-Item README.md, LICENSE dist\LanceDeck\

      # Azure Trusted Signing: signs only when the secrets are set (docs/SIGNING.md)
      - name: Sign
        if: ${{ env.ATS_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v0
        env:
          ATS_ACCOUNT: ${{ secrets.ATS_ACCOUNT }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ATS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.ATS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ATS_PROFILE }}
          files: dist/LanceDeck/LanceDeck.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notlike "v*") { $tag = "dev" }
          Compress-Archive -Path dist\LanceDeck -DestinationPath "dist\LanceDeck-$tag-win64.zip" -CompressionLevel Optimal

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/LanceDeck-*-win64.zip
          body_path: docs/ARTICLE.md

      - uses: actions/upload-artifact@v4
        with:
          name: LanceDeck
          path: dist/LanceDeck-*-win64.zip
